[project]
name = "mcp-server-template"
version = "0.1.0"
description = "Template for building MCP servers in Python (stdio + Streamable HTTP, bearer/OAuth auth)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
mcp-server-template = "mcp_server_template.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_template"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "T20"]
# Asserts document invariants already enforced by Settings validation.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "T20"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p anyio"
